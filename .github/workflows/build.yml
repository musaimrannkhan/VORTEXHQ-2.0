
name: Build VORTEX APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build VORTEX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VORTEX
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Initialize Expo project
        run: npx eas-cli@latest init --account musaimrannkhan --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          
